name: Build Android App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Locate Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ] && [ -z "$ANDROID_SDK_ROOT" ]; then
            echo "ANDROID_HOME=$HOME/Android/Sdk" >> "$GITHUB_ENV"
          fi
          echo "sdk.dir=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}" > local.properties
          cat local.properties
          ls "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx6g"

      - name: List APK outputs
        if: always()
        run: find app/build/outputs -name "*.apk" -maxdepth 6 -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mxboxs-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build/reports/**
            app/build/reports/**
          if-no-files-found: ignore
