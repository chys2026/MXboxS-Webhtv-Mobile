name: Build Android App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Python 3.10 (chaquopy buildPython)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Locate Android SDK and write local.properties
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          echo "Android SDK: $SDK"
          ls "$SDK" || true
          {
            echo "sdk.dir=$SDK"
            echo "chaquopyBuildPython=$(command -v python3.10 || command -v python3)"
          } > local.properties
          cat local.properties
          python3 --version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build debug APK (mobile, arm64)
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
        run: ./gradlew :app:assembleMobileArm64_v8aDebug --no-daemon --no-build-cache --rerun-tasks --stacktrace -Dorg.gradle.jvmargs="-Xmx6g"

      - name: List APK outputs
        if: always()
        run: find app/build/outputs -name "*.apk" -maxdepth 6 -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mxboxs-mobile-apk
          path: app/build/outputs/apk/mobile*/*/*.apk
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build/reports/**
            app/build/reports/**
          if-no-files-found: ignore
