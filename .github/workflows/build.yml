name: Build Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
      
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Debug APK
      run: ./gradlew assembleMobileDebug
      
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: MXboxS-TV-debug
        path: app/build/outputs/apk/mobile/debug/*.apk
        retention-days: 30
        
  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
      
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Release APK
      env:
        STORE_FILE: ${{ secrets.STORE_FILE }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        # Create local.properties with signing config if needed
        if [ -n "$STORE_FILE" ]; then
          echo "storeFile=$GITHUB_WORKSPACE/$STORE_FILE" >> local.properties
          echo "keyAlias=$KEY_ALIAS" >> local.properties
          echo "storePassword=$STORE_PASSWORD" >> local.properties
          echo "keyPassword=$KEY_PASSWORD" >> local.properties
        fi
        
        ./gradlew assembleMobileRelease
      
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: MXboxS-TV-release
        path: app/build/outputs/apk/mobile/release/*.apk
        retention-days: 90
      
    - name: Create GitHub Release
      if: success()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create ${{ github.ref_name }} \
          --title "Release ${{ github.ref_name }}" \
          --notes "Auto-generated release from commit ${{ github.sha }}" \
          app/build/outputs/apk/mobile/release/*.apk
